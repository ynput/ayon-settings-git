[project]
name = "ayon-settings-git"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ynput Team", email = "team@ynput.io" }
]
requires-python = ">=3.11.9"
dependencies = [
    "ty",
    "ruff ~= 0.15.0"
]

[dependency-groups]
dev = [
    "ayon-python-api",
    "httpx",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml",
    "starlette",
    "uvicorn",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"


[tool.ty.environment]
extra-paths = [
    "../ayon-core/client",
    "../ayon-maya/client",
    "../ayon-core/.venv/Lib/site-packages",
    "../ayon-docker/backend",
    "../ayon-python-api",
    "client"
]